<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Sorting bars forming an "S" shape -->
  <!-- Top bar (long) -->
  <rect x="12" y="10" width="32" height="7" rx="3.5" fill="url(#grad)"/>
  <!-- Middle-top bar (medium, right-aligned) -->
  <rect x="20" y="22" width="24" height="7" rx="3.5" fill="url(#grad)" opacity="0.9"/>
  <!-- Middle bar (long) -->
  <rect x="12" y="34" width="32" height="7" rx="3.5" fill="url(#grad)"/>
  <!-- Middle-bottom bar (medium, left-aligned) -->
  <rect x="12" y="46" width="24" height="7" rx="3.5" fill="url(#grad)" opacity="0.9"/>
  <!-- Bottom bar indicator dot -->
  <circle cx="49" cy="49.5" r="3.5" fill="#a855f7" opacity="0.7"/>
</svg>
