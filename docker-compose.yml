services:
  sortarr:
    # Image officielle publiée automatiquement sur GitHub Container Registry (GHCR)
    image: ghcr.io/lroffic/sortarr:latest
    container_name: sortarr
    restart: unless-stopped
    ports:
      # Port hôte : Port conteneur
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=Europe/Paris
    volumes:
      # Persistance de la configuration, des utilisateurs et de l'historique des stats
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
